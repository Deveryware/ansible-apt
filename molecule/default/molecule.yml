---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
  yamllint .
  ansible-lint
  ruff
platforms:
  - name: ansible-apt-debian11
    image: python:bullseye
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    pre_build_image: true

  - name: ansible-apt-debian12
    image: python:bookworm
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    pre_build_image: true

  - name: ansible-apt-debian13
    image: python:trixie
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    cgroupns_mode: host
    pre_build_image: true


provisioner:
  name: ansible
verifier:
  name: testinfra
# Verbose tests
  options:
    s: true
