---
- name: Empty sources list
  become: true
  ansible.builtin.copy:
    content: |
      # Ansible managed
    dest: /etc/apt/sources.list
    mode: '0644'
  when: apt_clean_sources_list

- name: Adding apt repository
  become: true
  apt_repository:
    codename: "{{ item.codename | default(omit) }}"
    filename: "{{ item.filename | default(omit) }}"
    mode: "{{ item.mode | default(omit) }}"
    repo: "{{ item.repo | default(omit) }}"
    state: "{{ item.state | default(omit) }}"
    update_cache: "{{ item.update_cache | default('yes') }}"
  with_items: "{{ apt_repositories }}"

- name: Configure deb822 repository
  become: true
  ansible.builtin.deb822_repository:
    name: "{{ item.name }}"
    types: "{{ item.type | default('deb') }}"
    uris: "{{ item.uris }}"
    suites: "{{ item.suites }}"
    components: "{{ item.components }}"
    signed_by: "{{ item.signed_by }}"
  loop: "{{ apt_deb822_repositories }}"
  register: repo

- name: Apt update
  become: true
  ansible.builtin.apt:
    update_cache: yes
  when: repo.changed
